server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: grigoriev-yanis-student-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/studentsdb}
    username: ${SPRING_DATASOURCE_USERNAME:studentapi}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  version: ${APP_VERSION:1.0-37038}
