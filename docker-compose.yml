name: grigoriev-yanis-student-api
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-studentsdb}
      POSTGRES_USER: ${DB_USER:-studentapi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run scripts/create_env.sh to create .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - student-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    image: grigoriev-yanis-student-api:v1.0-37038
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-studentsdb}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-studentapi}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Run scripts/create_env.sh to create .env}
      APP_VERSION: ${APP_VERSION:-1.0-37038}
    ports:
      - '18080:8080'
    networks:
      - student-net
    restart: unless-stopped
volumes:
  pgdata:
networks:
  student-net:
    driver: bridge
